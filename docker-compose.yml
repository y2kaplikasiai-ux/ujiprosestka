version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_tka_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password_rahasia_anda
      MYSQL_DATABASE: db_psikometri
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: ghcr.io/y2kapliasiai-ux/ujiprosestka:latest
    container_name: streamlit_tka_app
    restart: always
    ports:
      - "8501:8501"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password_rahasia_anda
      - MYSQL_DATABASE=db_psikometri
    depends_on:
      - db

volumes:
  mysql_data: